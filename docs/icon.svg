      <stop offset="100%" stop-color="#0d0c11" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.18" cy="0.16" r="0.62">
      <stop offset="0%" stop-color="#25f4ee" stop-opacity="0.22" />
